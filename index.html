        let inventoryData = [];
        let orderQtyMap = {};
        let orderHistory = [];
        let currentUser = null;
        let currentView = 'order';
        let isSyncingStock = false;

        // 雲端監聽庫存
        db.collection('inventory').doc('main_stock').onSnapshot((doc) => {
            if (isSyncingStock) return;
            if (doc.exists && doc.data().items) {
                inventoryData = doc.data().items;
            } else {
                inventoryData = fullCatalog;
                db.collection('inventory').doc('main_stock').set({ items: fullCatalog });
            }
            refreshCurrentPage();
        });

        // 雲端監聽訂單紀錄
        db.collection('orders').orderBy('timestamp', 'desc').onSnapshot((snapshot) => {
            orderHistory = [];
            snapshot.forEach(doc => {
                orderHistory.push(doc.data());
            });
            if (currentView === 'records') renderRecordsPage();
        });

        function refreshCurrentPage() {
            if (!currentUser) return;
            if (currentView === 'order') renderOrderPage();
            else if (currentView === 'stock') renderStockPage();
            else if (currentView === 'records') renderRecordsPage();
        }

        function handleLogin() {
            const acc = document.getElementById('loginAccount').value.trim();
            const pwd = document.getElementById('loginPassword').value.trim();

            if (acc === 'linkou' && pwd === '1234') {
                currentUser = { role: 'branch', name: '林口中山店' };
            } else if (acc === 'admin' && pwd === '8888') {
                currentUser = { role: 'hq', name: '總管理處' };
            } else {
                alert('帳號或密碼錯誤！請重新輸入。');
                return;
            }

            document.getElementById('loginScreen').classList.add('hidden');
            initAppSession();
        }

        function handleLogout() {
            currentUser = null;
            document.getElementById('loginAccount').value = '';
            document.getElementById('loginPassword').value = '';
            document.getElementById('loginScreen').classList.remove('hidden');
        }

        function initAppSession() {
            const titleEl = document.getElementById('appHeaderTitle');
            const stockTab = document.getElementById('tabStock');

            if (currentUser.role === 'hq') {
                titleEl.innerText = "風鳥堂總部後台";
                stockTab.style.display = 'block';
                switchView('stock');
            } else {
                titleEl.innerText = "風鳥堂（林口中山店）";
                stockTab.style.display = 'none';
                switchView('order');
            }
        }

        function switchView(view) {
            currentView = view;
            document.getElementById('tabOrder').classList.toggle('active', view === 'order');
            document.getElementById('tabRecords').classList.toggle('active', view === 'records');
            const stockBtn = document.getElementById('tabStock');
            if(stockBtn) stockBtn.classList.toggle('active', view === 'stock');

            const footer = document.getElementById('appFooter');
            const label = document.getElementById('systemModeLabel');

            if (view === 'order') {
                label.innerText = "分店叫貨模式";
                footer.style.display = 'block';
                renderOrderPage();
            } else if (view === 'records') {
                label.innerText = "歷史訂貨紀錄";
                footer.style.display = 'none';
                renderRecordsPage();
            } else if (view === 'stock') {
                label.innerText = "總部庫存管理模式";
                footer.style.display = 'none';
                renderStockPage();
            }
        }

        function renderOrderPage() {
            const container = document.getElementById('mainContent');
            let hasShortage = false;
            let shortageDetails = '';

            inventoryData.forEach(p => {
                let qty = orderQtyMap[p.id] || 0;
                let remaining = p.stock - qty;
                if (remaining <= 0) {
                    hasShortage = true;
                    shortageDetails += `• <strong>${p.name}</strong> 庫存不足（雲端剩餘：${p.stock}，欲叫：${qty}）<br>`;
                }
            });

            let html = `
                <div class="alert-banner ${hasShortage ? 'show' : ''}">
                    <div class="alert-title">⚠️ 總部雲端庫存不足警報</div>
                    <div class="alert-desc">${shortageDetails}</div>
                    <button class="email-notify-btn" onclick="sendEmailAlert()">📧 一鍵發送庫存告急信件給總部</button>
                </div>
            `;

            let currentCat = '';
            inventoryData.forEach(p => {
                if (p.category !== currentCat) {
                    currentCat = p.category;
                    html += `<div class="category-header">${currentCat}</div>`;
                }

                let qty = orderQtyMap[p.id] || 0;
                let priceStr = p.price > 0 ? `$${p.price}` : '依市價';
                let remaining = p.stock - qty;

                html += `
                    <div class="product-card">
                        <div class="product-info">
                            <h3>${p.name}</h3>
                            <p>單價：${priceStr} | 庫存：<span style="color:${remaining<=0?'red':'#5c181f'}; font-weight:bold;">${remaining}</span></p>
                        </div>
                        <div class="qty-control">
                            <button class="qty-btn" onclick="updateOrderQty(${p.id}, -1)">-</button>
                            <span class="qty-num">${qty}</span>
                            <button class="qty-btn" onclick="updateOrderQty(${p.id}, 1)">+</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            updateSummary();
        }

        function updateOrderQty(id, change) {
            let current = orderQtyMap[id] || 0;
            orderQtyMap[id] = Math.max(0, current + change);
            renderOrderPage();
        }

        function updateSummary() {
            let totalQty = 0;
            let totalPrice = 0;

            inventoryData.forEach(p => {
                let qty = orderQtyMap[p.id] || 0;
                if (qty > 0) {
                    totalQty += qty;
                    totalPrice += (p.price * qty);
                }
            });

            document.getElementById('totalQuantity').innerText = totalQty;
            document.getElementById('totalPrice').innerText = `$${totalPrice.toLocaleString()}`;
        }

        function renderStockPage() {
            const container = document.getElementById('mainContent');
            let html = `<div style="font-size:12.5px; font-weight:700; color:#5c181f; margin-bottom:10px;">📦 總部統一雲端庫存 (修改後全台即時同步)</div>`;
            
            inventoryData.forEach(p => {
                html += `
                    <div class="inv-card">
                        <div class="product-info">
                            <h3>${p.name}</h3>
                            <p>單價：$${p.price} | 分類：${p.category}</p>
                        </div>
                        <div>
                            <input type="number" class="inv-input" value="${p.stock}" onchange="updateStock(${p.id}, this.value)">
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function updateStock(id, val) {
            const newStock = parseInt(val) || 0;
            const updatedItems = inventoryData.map(item => {
                if (item.id === id) return { ...item, stock: newStock };
                return item;
            });
            db.collection('inventory').doc('main_stock').set({ items: updatedItems });
        }

        function renderRecordsPage() {
            const container = document.getElementById('mainContent');
            if (orderHistory.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#8c7662; margin-top:40px;">目前尚無雲端訂貨紀錄</div>`;
                return;
            }

            let html = '';
            orderHistory.forEach((record) => {
                let items = record.items || [];
                let totalPrice = record.totalPrice || 0;

                let itemsText = items.map(i => {
                    let sub = i.subtotal !== undefined ? i.subtotal : (i.price * i.qty);
                    return `${i.name} × ${i.qty} (小計: $${sub})`;
                }).join('<br>');

                html += `
                    <div class="record-card">
                        <div class="record-header">
                            <span>訂單 (${record.store || '分店'})</span>
                            <span>${record.time || '剛剛'}</span>
                        </div>
                        <div class="record-body">
                            <strong>叫貨明細：</strong><br>${itemsText}<br>
                            <div style="margin-top:6px; text-align:right; font-weight:bold; color:#5c181f;">總金額：$${totalPrice.toLocaleString()} 元</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function sendEmailAlert() {
            let subject = encodeURIComponent("【⚠️ 風鳥堂庫存不足告急通知】林口中山店");
            let bodyText = "【風鳥堂總部 - 庫存告急警報】\n分店：林口中山店\n以下品項庫存不足，請總部盡速安排補貨：\n\n";
            
            inventoryData.forEach(p => {
                let qty = orderQtyMap[p.id] || 0;
                if ((p.stock - qty) <= 0) {
                    bodyText += `- ${p.name} (規格: ${p.category}, 目前庫存: ${p.stock}, 欲叫: ${qty})\n`;
                }
            });

            bodyText += "\n此信件由風鳥堂智慧叫貨系統自動觸發。";
            let mailtoUrl = `mailto:${HQ_EMAIL}?subject=${subject}&body=${encodeURIComponent(bodyText)}`;
            window.location.href = mailtoUrl;
        }

        function submitOrderAndExport() {
            let activeItems = [];
            let updatedItems = JSON.parse(JSON.stringify(inventoryData));
            let totalPrice = 0;

            inventoryData.forEach((p, idx) => {
                let qty = orderQtyMap[p.id] || 0;
                if (qty > 0) {
                    let subtotal = p.price * qty;
                    totalPrice += subtotal;
                    activeItems.push({ name: p.name, price: p.price, qty: qty, subtotal: subtotal });
                    updatedItems[idx].stock = Math.max(0, updatedItems[idx].stock - qty);
                }
            });

            if (activeItems.length === 0) {
                alert('請先選擇至少一項叫貨數量！');
                return;
            }

            isSyncingStock = true;
            inventoryData = updatedItems;

            let orderRecord = {
                store: currentUser ? currentUser.name : '林口中山店',
                time: new Date().toLocaleString(),
                timestamp: Date.now(),
                items: activeItems,
                totalPrice: totalPrice
            };

            db.collection('orders').add(orderRecord);
            db.collection('inventory').doc('main_stock').set({ items: updatedItems }).then(() => {
                setTimeout(() => { isSyncingStock = false; }, 1200);
            });

            let fileContent = "====================================\n";
            fileContent += "   風鳥堂 - 分店叫貨通知單\n";
            fileContent += "   分店：" + orderRecord.store + "\n";
            fileContent += "   時間：" + orderRecord.time + "\n";
            fileContent += "====================================\n\n";

            activeItems.forEach(i => {
                fileContent += `[品名] ${i.name}\n`;
                fileContent += `[數量] ${i.qty} | [小計] $${i.subtotal}\n`;
                fileContent += "------------------------------------\n";
            });
            fileContent += `\n總計金額：$${totalPrice.toLocaleString()} 元\n`;

            const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `風鳥堂_${orderRecord.store}_叫貨單_${new Date().toISOString().slice(0,10)}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            let subject = encodeURIComponent(`【📦 風鳥堂分店叫貨單】${orderRecord.store} (總金額: $${totalPrice.toLocaleString()})`);
            let bodyText = `【風鳥堂分店叫貨通知】\n分店：${orderRecord.store}\n叫貨時間：${orderRecord.time}\n\n叫貨明細：\n`;
            activeItems.forEach(i => {
                bodyText += `- ${i.name} × ${i.qty} (小計: $${i.subtotal})\n`;
            });
            bodyText += `\n總金額：$${totalPrice.toLocaleString()} 元\n(系統已同步扣除雲端庫存，並下載叫貨單文字檔)`;

            let mailtoUrl = `mailto:${HQ_EMAIL}?subject=${subject}&body=${encodeURIComponent(bodyText)}`;
            
            setTimeout(() => {
                window.location.href = mailtoUrl;
            }, 500);

            orderQtyMap = {};
            alert('✅ 訂單已上傳雲端並扣除庫存，叫貨單已下載，即將自動轉發 Email 給總部！');
            switchView('records');
        }
    </script>
