<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>風鳥堂 - 智慧叫貨與多帳號管理系統</title>
    <!-- Firebase SDK (v9 Moduler translated for CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #3b2c24;
            background-image: 
                radial-gradient(#4d3c32 1.5px, transparent 1.5px),
                radial-gradient(#4d3c32 1.5px, #3b2c24 1.5px);
            background-size: 32px 32px;
            background-position: 0 0, 16px 16px;
            font-family: 'Noto Sans TC', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            color: #2c2523;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            height: 880px;
            background: #fffdf8;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 8px solid #5c181f;
        }

        /* 登入畫面 */
        .login-screen {
            position: absolute;
            inset: 0;
            background: #fffdf8;
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
        }

        .login-screen.hidden {
            display: none;
        }

        .login-logo {
            font-family: 'Noto Serif TC', serif;
            font-size: 24px;
            font-weight: 900;
            color: #5c181f;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .login-subtitle {
            font-size: 12px;
            color: #8c7662;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .login-input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 12px;
            border: 1px solid #c8a362;
            border-radius: 8px;
            font-size: 14px;
            background: #fcf8f0;
            color: #2b221e;
        }

        .login-btn {
            width: 100%;
            background: #5c181f;
            color: #f7e0b5;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(92,24,31,0.2);
        }

        .login-hint {
            margin-top: 20px;
            font-size: 11.5px;
            color: #8c7662;
            line-height: 1.6;
            background: #f7f2ea;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            text-align: left;
        }

        .sync-badge {
            display: inline-block;
            background: #e6f4ea;
            color: #137333;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 8px;
            font-weight: bold;
        }

        /* App 內部樣式 */
        .app-header {
            background: #2b221e;
            color: #f7e0b5;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #c8a362;
        }

        .app-title h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: 16px;
            letter-spacing: 1px;
        }

        .app-title p {
            font-size: 11px;
            color: #c5b399;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #c5b399;
            color: #c5b399;
            padding: 4px 10px;
            font-size: 11px;
            border-radius: 12px;
            cursor: pointer;
        }

        .nav-tabs {
            display: flex;
            background: #f3ebd8;
            padding: 8px 10px;
            gap: 6px;
            border-bottom: 1px solid #e2d4bc;
            flex-shrink: 0;
        }

        .nav-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 6px 0;
            font-size: 12px;
            color: #66554e;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 700;
            text-align: center;
        }

        .nav-btn.active {
            background: #5c181f;
            color: #fffdf8;
        }

        .content-area {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            background: #fcf8f0;
        }

        .product-card {
            background: #ffffff;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #ebdcc5;
        }

        .product-info h3 {
            font-size: 14px;
            color: #2b221e;
            margin-bottom: 2px;
            font-weight: 700;
        }

        .product-info p {
            font-size: 11px;
            color: #8c7662;
        }

        .qty-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            background: #f3ebd8;
            border: 1px solid #d8caa8;
            border-radius: 50%;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            color: #2b221e;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-num {
            font-size: 14px;
            font-weight: 700;
            min-width: 20px;
            text-align: center;
            color: #5c181f;
        }

        .inv-card {
            background: #ffffff;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            border: 1px solid #ebdcc5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .inv-input {
            width: 65px;
            padding: 6px;
            text-align: center;
            border: 1px solid #c8a362;
            border-radius: 6px;
            font-weight: 700;
            font-size: 14px;
            color: #5c181f;
            background: #fcf8f0;
        }

        .record-card {
            background: #ffffff;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 10px;
            border: 1px solid #ebdcc5;
            font-size: 12.5px;
        }

        .record-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px dashed #e2d4bc;
            font-weight: 700;
            color: #5c181f;
        }

        .record-body {
            color: #52463e;
            line-height: 1.5;
        }

        .alert-banner {
            background: #fdf2f2;
            border: 1px solid #f5c6cb;
            border-left: 4px solid #dc3545;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: none;
        }

        .alert-banner.show {
            display: block;
        }

        .alert-title {
            font-size: 12.5px;
            font-weight: 700;
            color: #721c24;
            margin-bottom: 2px;
        }

        .alert-desc {
            font-size: 11.5px;
            color: #842029;
            line-height: 1.4;
            margin-bottom: 6px;
        }

        .line-notify-btn {
            background: #06c755;
            color: white;
            border: none;
            padding: 5px 12px;
            font-size: 11.5px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
        }

        .app-footer {
            background: #fffdf8;
            padding: 15px 20px;
            border-top: 1px solid #e2d4bc;
            flex-shrink: 0;
        }

        .cart-summary {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
            color: #52463e;
        }

        .submit-btn {
            width: 100%;
            background: #5c181f;
            color: #f7e0b5;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(92, 24, 31, 0.2);
        }

        .loading-spin {
            text-align: center;
            color: #8c7662;
            font-size: 13px;
            padding: 30px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 登入畫面 -->
        <div class="login-screen" id="loginScreen">
            <div class="login-logo">風鳥堂叫貨系統</div>
            <div class="login-subtitle">W.B.C MEMBER EXCLUSIVE</div>
            
            <input type="text" class="login-input" id="loginAccount" placeholder="請輸入分店代號或總部帳號">
            <input type="password" class="login-input" id="loginPassword" placeholder="請輸入登入密碼">
            <button class="login-btn" onclick="handleLogin()">登入系統</button>

            <span class="sync-badge">☁️ 已連線至專屬 Firebase 雲端資料庫</span>

            <div class="login-hint">
                💡 <strong>測試帳號說明：</strong><br>
                • 分店登入：帳號 <code style="color:#5c181f">linkou</code> / 密碼 <code style="color:#5c181f">1234</code><br>
                • 總部登入：帳號 <code style="color:#5c181f">admin</code> / 密碼 <code style="color:#5c181f">8888</code>
            </div>
        </div>

        <!-- 頂部導覽 -->
        <div class="app-header">
            <div class="app-title">
                <h1 id="appHeaderTitle">風鳥堂叫貨系統</h1>
                <p id="systemModeLabel">分店模式 (雲端同步中)</p>
            </div>
            <button class="logout-btn" onclick="handleLogout()">登出</button>
        </div>

        <!-- 功能分頁按鈕 -->
        <div class="nav-tabs" id="navTabsContainer">
            <button class="nav-btn active" id="tabOrder" onclick="switchView('order')">🛒 線上叫貨</button>
            <button class="nav-btn" id="tabRecords" onclick="switchView('records')">📋 訂貨紀錄</button>
            <button class="nav-btn" id="tabStock" onclick="switchView('stock')" style="display:none;">📦 庫存管理</button>
        </div>

        <!-- 主內容區 -->
        <div class="content-area" id="mainContent">
            <div class="loading-spin">☁️ 雲端資料同步中...</div>
        </div>

        <!-- 底部區塊 -->
        <div class="app-footer" id="appFooter">
            <div class="cart-summary">
                <span>已選叫貨：<strong id="totalQuantity">0</strong> 件</span>
                <span>品項數：<strong id="itemTypes">0</strong> 項</span>
            </div>
            <button class="submit-btn" onclick="submitOrderAndExport()">📥 送出訂單並產生檔案通知總部</button>
        </div>
    </div>

    <script>
        // 專屬 Firebase 雲端金鑰已寫死（全平臺零設定直接同步）
        const firebaseConfig = {
            apiKey: "AIzaSyBAya9kkgVHTMsPLjn0llU1EZ3mLS37TpU",
            authDomain: "windbirdsorder.firebaseapp.com",
            projectId: "windbirdsorder",
            storageBucket: "windbirdsorder.firebasestorage.app",
            messagingSenderId: "781661616278",
            appId: "1:781661616278:web:f374f38c9f260fa05baab7",
            measurementId: "G-JBTTTELXXV"
        };

        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // 匿名登入以確保 Firestore 安全規則存取
        auth.signInAnonymously().catch(err => console.log("Firebase Auth error:", err));

        // 預設品項
        const defaultInventory = [
            { id: 1, name: '斯里蘭卡紅茶包', spec: '600g / 包', stock: 5 },
            { id: 2, name: '高山青茶葉', spec: '600g / 包', stock: 10 },
            { id: 3, name: '特級茉莉綠茶', spec: '600g / 包', stock: 3 },
            { id: 4, name: '手作黑糖漿', spec: '5kg / 桶', stock: 8 },
            { id: 5, name: 'Q彈珍珠', spec: '3kg / 包', stock: 2 }
        ];

        let inventoryData = [];
        let orderQtyMap = {};
        let orderHistory = [];
        let currentUser = null;
        let currentView = 'order';

        // 監聽雲端庫存變化（秒級即時跨裝置同步）
        db.collection('inventory').doc('main_stock').onSnapshot((doc) => {
            if (doc.exists && doc.data().items) {
                inventoryData = doc.data().items;
            } else {
                inventoryData = defaultInventory;
                db.collection('inventory').doc('main_stock').set({ items: defaultInventory });
            }
            refreshCurrentPage();
        }, (err) => {
            console.error("雲端讀取失敗：", err);
            inventoryData = defaultInventory;
            refreshCurrentPage();
        });

        // 監聽雲端訂單紀錄變化
        db.collection('orders').orderBy('timestamp', 'desc').onSnapshot((snapshot) => {
            orderHistory = [];
            snapshot.forEach(doc => {
                orderHistory.push(doc.data());
            });
            if (currentView === 'records') renderRecordsPage();
        });

        function refreshCurrentPage() {
            if (!currentUser) return;
            if (currentView === 'order') renderOrderPage();
            else if (currentView === 'stock') renderStockPage();
            else if (currentView === 'records') renderRecordsPage();
        }

        // 登入邏輯
        function handleLogin() {
            const acc = document.getElementById('loginAccount').value.trim();
            const pwd = document.getElementById('loginPassword').value.trim();

            if (acc === 'linkou' && pwd === '1234') {
                currentUser = { role: 'branch', name: '林口中山店' };
            } else if (acc === 'admin' && pwd === '8888') {
                currentUser = { role: 'hq', name: '總管理處' };
            } else {
                alert('帳號或密碼錯誤！請重新輸入。');
                return;
            }

            document.getElementById('loginScreen').classList.add('hidden');
            initAppSession();
        }

        function handleLogout() {
            currentUser = null;
            document.getElementById('loginAccount').value = '';
            document.getElementById('loginPassword').value = '';
            document.getElementById('loginScreen').classList.remove('hidden');
        }

        function initAppSession() {
            const titleEl = document.getElementById('appHeaderTitle');
            const stockTab = document.getElementById('tabStock');

            if (currentUser.role === 'hq') {
                titleEl.innerText = "風鳥堂總部後台";
                stockTab.style.display = 'block';
                switchView('stock');
            } else {
                titleEl.innerText = "風鳥堂（林口中山店）";
                stockTab.style.display = 'none';
                switchView('order');
            }
        }

        function switchView(view) {
            currentView = view;
            document.getElementById('tabOrder').classList.toggle('active', view === 'order');
            document.getElementById('tabRecords').classList.toggle('active', view === 'records');
            const stockBtn = document.getElementById('tabStock');
            if(stockBtn) stockBtn.classList.toggle('active', view === 'stock');

            const footer = document.getElementById('appFooter');
            const label = document.getElementById('systemModeLabel');

            if (view === 'order') {
                label.innerText = "分店叫貨模式 (雲端連線)";
                footer.style.display = 'block';
                renderOrderPage();
            } else if (view === 'records') {
                label.innerText = "歷史訂貨紀錄";
                footer.style.display = 'none';
                renderRecordsPage();
            } else if (view === 'stock') {
                label.innerText = "總部庫存管理 (雲端同步)";
                footer.style.display = 'none';
                renderStockPage();
            }
        }

        function renderOrderPage() {
            const container = document.getElementById('mainContent');
            let hasShortage = false;
            let shortageDetails = '';

            inventoryData.forEach(p => {
                let qty = orderQtyMap[p.id] || 0;
                let remaining = p.stock - qty;
                if (remaining <= 0) {
                    hasShortage = true;
                    shortageDetails += `• <strong>${p.name}</strong> 庫存不足（雲端剩餘：${p.stock}，欲叫：${qty}）<br>`;
                }
            });

            let html = `
                <div class="alert-banner ${hasShortage ? 'show' : ''}">
                    <div class="alert-title">⚠️ 總部雲端庫存不足警報</div>
                    <div class="alert-desc">${shortageDetails}</div>
                    <button class="line-notify-btn" onclick="sendLineAlert()">🟢 一鍵 LINE 通知總部</button>
                </div>
            `;

            inventoryData.forEach(p => {
                let qty = orderQtyMap[p.id] || 0;
                let remaining = p.stock - qty;
                html += `
                    <div class="product-card">
                        <div class="product-info">
                            <h3>${p.name}</h3>
                            <p>規格：${p.spec} | 雲端庫存：<span style="color:${remaining<=0?'red':'#5c181f'}; font-weight:bold;">${remaining}</span></p>
                        </div>
                        <div class="qty-control">
                            <button class="qty-btn" onclick="updateOrderQty(${p.id}, -1)">-</button>
                            <span class="qty-num">${qty}</span>
                            <button class="qty-btn" onclick="updateOrderQty(${p.id}, 1)">+</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            updateSummary();
        }

        function updateOrderQty(id, change) {
            let current = orderQtyMap[id] || 0;
            orderQtyMap[id] = Math.max(0, current + change);
            renderOrderPage();
        }

        function updateSummary() {
            let totalTypes = 0;
            let totalQty = 0;
            inventoryData.forEach(p => {
                let qty = orderQtyMap[p.id] || 0;
                if (qty > 0) {
                    totalTypes++;
                    totalQty += qty;
                }
            });
            document.getElementById('totalQuantity').innerText = totalQty;
            document.getElementById('itemTypes').innerText = totalTypes;
        }

        function renderStockPage() {
            const container = document.getElementById('mainContent');
            let html = `<div style="font-size:13px; font-weight:700; color:#5c181f; margin-bottom:10px;">📦 總部統一雲端庫存 (修改後全台即時同步)</div>`;
            
            inventoryData.forEach(p => {
                html += `
                    <div class="inv-card">
                        <div class="product-info">
                            <h3>${p.name}</h3>
                            <p>規格：${p.spec}</p>
                        </div>
                        <div>
                            <input type="number" class="inv-input" value="${p.stock}" onchange="updateStock(${p.id}, this.value)">
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // 修改庫存直接推送到 Firebase 雲端
        function updateStock(id, val) {
            const newStock = parseInt(val) || 0;
            const updatedItems = inventoryData.map(item => {
                if (item.id === id) return { ...item, stock: newStock };
                return item;
            });
            db.collection('inventory').doc('main_stock').set({ items: updatedItems });
        }

        function renderRecordsPage() {
            const container = document.getElementById('mainContent');
            if (orderHistory.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#8c7662; margin-top:40px;">目前尚無雲端訂貨紀錄</div>`;
                return;
            }

            let html = '';
            orderHistory.forEach((record, index) => {
                let itemsText = record.items.map(i => `${i.name} × ${i.qty}`).join('<br>');
                html += `
                    <div class="record-card">
                        <div class="record-header">
                            <span>訂單 (${record.store})</span>
                            <span>${record.time}</span>
                        </div>
                        <div class="record-body">
                            <strong>叫貨明細：</strong><br>${itemsText}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function sendLineAlert() {
            let shortageText = "【⚠️ 風鳥堂庫存不足警報】\n分店：林口中山店\n回報狀態：以下品項雲端庫存不足，請總部盡速補貨！";
            inventoryData.forEach(p => {
                let qty = orderQtyMap[p.id] || 0;
                if ((p.stock - qty) <= 0) {
                    shortageText += `\n- ${p.name} (剩餘庫存: ${p.stock})`;
                }
            });
            let lineUrl = `https://line.me/R/msg/text/?${encodeURIComponent(shortageText)}`;
            window.open(lineUrl, '_blank');
        }

        function submitOrderAndExport() {
            let activeItems = [];
            let updatedItems = [...inventoryData];

            inventoryData.forEach((p, idx) => {
                let qty = orderQtyMap[p.id] || 0;
                if (qty > 0) {
                    activeItems.push({ name: p.name, spec: p.spec, qty: qty });
                    // 自動扣除庫存
                    updatedItems[idx].stock = Math.max(0, updatedItems[idx].stock - qty);
                }
            });

            if (activeItems.length === 0) {
                alert('請先選擇至少一項叫貨數量！');
                return;
            }

            let orderRecord = {
                store: currentUser ? currentUser.name : '林口中山店',
                time: new Date().toLocaleString(),
                timestamp: Date.now(),
                items: activeItems
            };

            // 寫入雲端 Firebase
            db.collection('orders').add(orderRecord);
            db.collection('inventory').doc('main_stock').set({ items: updatedItems });

            // 下載叫貨單 .txt
            let fileContent = "====================================\n";
            fileContent += "   風鳥堂 - 分店叫貨通知單 (雲端連線)\n";
            fileContent += "   分店：" + orderRecord.store + "\n";
            fileContent += "   時間：" + orderRecord.time + "\n";
            fileContent += "====================================\n\n";

            activeItems.forEach(i => {
                fileContent += `[品名] ${i.name} (${i.spec})\n`;
                fileContent += `[叫貨數量] ${i.qty}\n`;
                fileContent += "------------------------------------\n";
            });

            const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `風鳥堂_${orderRecord.store}_叫貨單_${new Date().toISOString().slice(0,10)}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            orderQtyMap = {};
            alert('✅ 訂單已上傳雲端，庫存已即時扣除，並成功下載叫貨單檔案！');
            switchView('records');
        }
    </script>
